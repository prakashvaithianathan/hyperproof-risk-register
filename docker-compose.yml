version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: risk_register_db
    environment:
      POSTGRES_DB: risk_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
